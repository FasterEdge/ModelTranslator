name: 'Release 打包'
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建并上传的版本标签，例如 v1.0.20260920；留空则只构建不上传'
        required: false
        type: string
  push:
    tags:
      - 'v*'
  release:
    types: [published, released]

permissions:
  contents: write

concurrency:
  group: 'model-translator-release-${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: false

jobs:
  release:
    name: '打包源码并发布 Release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: '校验版本号与发布标签一致'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)"
          tag="${INPUT_TAG:-}"
          [ -n "$tag" ] || tag="${RELEASE_TAG:-$REF_NAME}"
          echo "源码版本号: v${version}"
          echo "发布标签:   ${tag:-<未指定>}"
          if [ -z "${tag}" ] || [ "${tag}" = "main" ] || [ "${tag}" = "master" ]; then
            echo '未指定发布标签，跳过一致性校验。'
            exit 0
          fi
          if [ "${tag}" != "v${version}" ]; then
            echo "::error::发布标签 ${tag} 与源码版本号 v${version} 不一致，请先把版本号改成 ${tag#v} 再发布。"
            exit 1
          fi

      - name: '打包源码与 uv.lock'
        run: |
          mkdir -p release
          tar czf release/model-translator-src.tar.gz \
            --exclude='.git' --exclude='.github' --exclude='.venv' \
            --exclude='__pycache__' --exclude='*.pyc' --exclude='.pytest_cache' \
            --exclude='.ruff_cache' \
            LICENSE Logo.png README.md README_en.md SECURITY.md \
            pyproject.toml uv.lock Dockerfile docker-compose.yml src tests

      - name: '生成 MD5/SHA1 校验文件'
        run: |
          set -euo pipefail
          cd release
          md5sum model-translator-src.tar.gz > checksums-md5.txt
          sha1sum model-translator-src.tar.gz > checksums-sha1.txt

      - name: '上传到 Release'
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.event.release.tag_name || github.ref_name }}
          name: 'ModelTranslator v${{ github.event.inputs.tag || github.event.release.tag_name || github.ref_name }}'
          body: |
            ## ModelTranslator v${{ github.event.inputs.tag || github.event.release.tag_name || github.ref_name }}

            ### 源码包
            - `model-translator-src.tar.gz`：uv 环境源码包，解压后执行 `uv sync` 即可使用 `model-translator` CLI。

            ### Docker 镜像
            `model-translator-image.tar.gz` 由 `docker-image.yml` 自动附加，导入方式：
            `docker load -i model-translator-image.tar.gz`
          files: |
            release/model-translator-src.tar.gz
            release/checksums-md5.txt
            release/checksums-sha1.txt
          fail_on_unmatched_files: true
